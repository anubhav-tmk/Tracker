<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Tracker</title>
<style>
/* ===== Theme ===== */
:root{--bg:#f6f7f9;--panel:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--soft:#eef0f3;--r:12px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#151b2b;--text:#e5e7eb;--muted:#9ca3af;--line:#263044;--accent:#60a5fa;--danger:#f87171;--soft:#1f2738}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:20px}h2{font-size:15px}h3{font-size:14px}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}.err{color:var(--danger)}
/* ===== Layout ===== */
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:10px}
main{padding-top:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
/* ===== Controls ===== */
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
input:disabled,select:disabled{opacity:.45}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
[data-state=ok] .sdot{background:#10b981}[data-state=syncing] .sdot{background:#f59e0b}
[data-state=error] .sdot,[data-state=auth] .sdot,[data-state=offline] .sdot{background:var(--danger)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;width:max-content}
.tabs button{border:0;background:none;padding:6px 18px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs [aria-selected=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
/* ===== Tasks ===== */
.qa{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.qa #qaTitle{flex:1 1 220px}.qa select,.qa input[type=date]{flex:0 1 auto;width:auto}
.sec{margin-bottom:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sechead h2,details.done-list summary{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
details.done-list summary{cursor:pointer;padding:6px 0;margin-bottom:6px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.cb{flex:1;min-width:0}
.ct{font-weight:600;overflow-wrap:anywhere}
.card.is-done .ct{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:3px;align-items:center}
.cat{color:var(--c);font-weight:600}
.pill{padding:1px 8px;border-radius:999px;background:var(--soft);font-size:11.5px;color:var(--text)}
.pill.doing{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.pill.done{background:color-mix(in srgb,#10b981 24%,transparent)}
.overdue{color:var(--danger);font-weight:600}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.track{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.track span{display:block;height:100%;background:var(--c);border-radius:3px}
.pct{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.last{font-size:13px;margin-top:6px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.last time{font-weight:600;margin-right:4px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;padding:0;position:relative;margin-top:1px}
.check.on{background:var(--c)}
.check.on::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dots{display:flex;gap:5px;margin-top:8px}
.d7{width:10px;height:10px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.d7.on{background:var(--c);border-color:var(--c)}
.d7.today{outline:1px solid var(--muted);outline-offset:1px}
.empty{margin:0;padding:4px 0}
/* ===== Calendar ===== */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.calhead h2{font-size:18px}
.calnav{display:flex;gap:6px}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{background:var(--panel);border:0;border-radius:0;min-height:96px;padding:4px;display:flex;flex-direction:column;align-items:stretch;text-align:left;cursor:pointer;min-width:0;font-size:12px}
.day.other{background:var(--bg);color:var(--muted)}
.day:focus-visible{outline-offset:-3px}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.num{width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%;font-weight:600;margin-bottom:2px}
.day.today .num{background:var(--accent);color:#fff}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{display:block;font-size:11px;line-height:1.35;padding:1px 4px;border-radius:4px;background:var(--soft);background:color-mix(in srgb,var(--c) 22%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.rows .row:first-child{border-top:0}
.row .check{width:20px;height:20px}.row .check.on::after{left:5px;top:1px;width:5px;height:10px}
.rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt.done{text-decoration:line-through;color:var(--muted)}
.rm{font-size:12px;color:var(--muted);white-space:nowrap}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
@media (max-width:720px){.panels{grid-template-columns:1fr}}
@media (max-width:640px){
  .day{min-height:58px;padding:3px}
  .evs{flex-direction:row;flex-wrap:wrap;gap:3px}
  .ev{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--c);font-size:0}
  .more{font-size:10px;padding:0}.more .wide{display:none}
}
/* ===== Dialogs ===== */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top));overflow:auto}
dialog::backdrop{background:rgb(0 0 0/.45)}
.dlg{padding:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.dhead h2{font-size:17px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label,.noterow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.full{grid-column:1/-1}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
.notes{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.notes h3{margin-bottom:8px}
.noterow{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.noterow label{width:140px}
.notelist{list-style:none;padding:0;margin:12px 0 0}
.notelist li{border-top:1px solid var(--line);padding:8px 0}
.nh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.nh .pp{font-weight:600;color:var(--text)}
.x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--danger)}
.notelist p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dfoot{display:flex;justify-content:space-between;margin-top:18px}
.set section{border-top:1px solid var(--line);padding:14px 0}
.set section:first-child{border-top:0;padding-top:0}
.set h3{margin-bottom:6px}
.set p{margin:6px 0}
.row2{display:flex;gap:8px}
.feeds{list-style:none;padding:0;margin:0 0 8px}
.feeds li{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.fname{flex:1;min-width:120px}
.set ol{padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <h1>Tracker</h1>
    <button id="syncBtn" class="btn" data-act="settings" data-state="local" aria-label="Sync status. Open settings"><span class="sdot" aria-hidden="true"></span><span id="syncTxt">Local only</span></button>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-tasks" aria-controls="view-tasks" data-tab="tasks">Tasks</button>
      <button role="tab" id="tab-calendar" aria-controls="view-calendar" data-tab="calendar">Calendar</button>
    </div>
    <div class="chips" id="filters" role="group" aria-label="Filter by category"></div>
  </div>
</header>

<main class="wrap">
  <section id="view-tasks" role="tabpanel" aria-labelledby="tab-tasks">
    <form id="qa" class="qa" autocomplete="off">
      <input id="qaTitle" placeholder="Add a task…" aria-label="Task title" required>
      <select id="qaCat" aria-label="Category"></select>
      <select id="qaType" aria-label="Task type">
        <option value="none">No deadline</option><option value="deadline">With deadline</option><option value="daily">Daily</option>
      </select>
      <input id="qaDate" type="date" aria-label="Deadline" hidden>
      <button class="btn primary">Add</button>
    </form>
    <div id="taskList"></div>
  </section>

  <section id="view-calendar" role="tabpanel" aria-labelledby="tab-calendar" hidden>
    <div class="calhead">
      <h2 id="calTitle"></h2>
      <div class="calnav">
        <button class="btn" data-act="prev" aria-label="Previous month">‹</button>
        <button class="btn" data-act="today">Today</button>
        <button class="btn" data-act="next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="wkdays" id="wkdays" aria-hidden="true"></div>
    <div class="grid" id="grid"></div>
    <div class="panels"><div class="panel" id="dayPanel"></div><div class="panel" id="upPanel"></div></div>
  </section>
</main>

<!-- Editor -->
<dialog id="ed" aria-labelledby="edHead">
  <form id="edForm" class="dlg" autocomplete="off">
    <div class="dhead"><h2 id="edHead">Task</h2><button type="button" class="btn" data-act="closeEd">Done</button></div>
    <div class="fields">
      <label class="full">Title<input name="title" placeholder="Title"></label>
      <label>Category<select name="cat" id="edCat"></select></label>
      <label data-for="task">Repeats<select name="daily"><option value="0">One-time</option><option value="1">Daily</option></select></label>
      <label data-for="task" data-hide-daily>Status<select name="status"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></label>
      <label data-hide-daily><span id="dateLbl">Deadline</span><input type="date" name="date"></label>
      <label data-hide-daily>Time (optional)<input type="time" name="time"></label>
      <label data-hide-daily>Reminder<select name="remind" id="edRemind"></select></label>
      <label data-for="task" class="full">Progress <output id="pOut">0%</output><input type="range" name="progress" min="0" max="100" step="5"></label>
      <label data-for="date" class="full">Details<textarea name="details" rows="4"></textarea></label>
    </div>
    <div data-for="task" class="notes">
      <h3>Progress notes</h3>
      <textarea id="noteText" rows="2" placeholder="What did you get done?" aria-label="Note text"></textarea>
      <div class="noterow">
        <label>Progress now %<input id="notePct" type="number" min="0" max="100" step="5" inputmode="numeric"></label>
        <button type="button" class="btn" data-act="addNote">Add note</button>
      </div>
      <ul id="noteList" class="notelist"></ul>
    </div>
    <div class="dfoot"><button type="button" class="btn danger" data-act="del">Delete</button></div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="set" aria-labelledby="setHead">
  <div class="dlg set">
    <div class="dhead"><h2 id="setHead">Settings</h2><button type="button" class="btn" data-act="closeSet">Close</button></div>
    <div id="setBody"></div>
  </div>
</dialog>

<script>
'use strict';
/* ===== Constants ===== */
const KEY = 'tracker.v1', SKEY = 'tracker.sync', FKEY = 'tracker.fired', DATA_FILE = 'tracker-data.json';
const CATS = { 'Self-Development': '#8b5cf6', Career: '#0ea5e9', School: '#f59e0b', Personal: '#10b981' };
const DEFAULT_CAT = 'Personal';
const STATUS = { todo: 'To do', doing: 'In progress', done: 'Done' };
const REMINDERS = [['', 'None'], ['at', 'At time'], ['10m', '10 min before'], ['1h', '1 hour before'], ['1d', '1 day before'], ['3d', '3 days before'], ['1w', '1 week before']];
const REM_MIN = { at: 0, '10m': 10, '1h': 60, '1d': 1440, '3d': 4320, '1w': 10080 };
const RE_DATE = /^\d{4}-\d{2}-\d{2}$/, RE_TIME = /^\d{2}:\d{2}$/;

/* ===== Utilities ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const has = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDate = s => parseYmd(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
const fmtStamp = ms => new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const catColor = c => CATS[has(CATS, c) ? c : DEFAULT_CAT];
const slug = c => c.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const byWhen = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
const readJSON = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch { return f; } };

/* ===== State & persistence ===== */
// Sanitises any item (local or from the gist) so rendering can trust its fields.
function normalize(id, x) {
  if (!x || typeof x !== 'object') return null;
  const updatedAt = Number(x.updatedAt) || 0, str = v => (typeof v === 'string' ? v : '');
  if (x.deleted) return { id, deleted: true, updatedAt };
  return {
    id, kind: x.kind === 'date' ? 'date' : 'task', title: str(x.title),
    cat: has(CATS, x.cat) ? x.cat : DEFAULT_CAT, status: has(STATUS, x.status) ? x.status : 'todo',
    progress: clamp(Math.round(Number(x.progress) || 0), 0, 100),
    date: RE_DATE.test(x.date) ? x.date : '', time: RE_TIME.test(x.time) ? x.time : '',
    remind: has(REM_MIN, x.remind) ? x.remind : '', details: str(x.details),
    notes: Array.isArray(x.notes) ? x.notes.filter(n => n && typeof n === 'object').map(n => ({
      id: str(n.id) || uid(), at: Number(n.at) || 0, text: str(n.text),
      from: clamp(Number(n.from) || 0, 0, 100), to: clamp(Number(n.to) || 0, 0, 100) })) : [],
    daily: !!x.daily,
    doneDays: x.doneDays && typeof x.doneDays === 'object' ? Object.fromEntries(Object.keys(x.doneDays).filter(k => RE_DATE.test(k)).map(k => [k, 1])) : {},
    createdAt: Number(x.createdAt) || updatedAt, updatedAt
  };
}
function loadState() {
  const raw = readJSON(KEY, {}), items = {};
  for (const [id, x] of Object.entries(raw.items || {})) { if (id === '__proto__') continue; const n = normalize(id, x); if (n) items[id] = n; }
  return { items };
}
let state = loadState();
const persist = () => localStorage.setItem(KEY, JSON.stringify(state));
const live = () => Object.values(state.items).filter(i => !i.deleted);
function commit() { persist(); render(); scheduleSync(); }

function create(fields) {
  const now = Date.now();
  const it = Object.assign({ id: uid(), kind: 'task', title: '', cat: DEFAULT_CAT, status: 'todo', progress: 0, date: '', time: '',
    remind: '', details: '', notes: [], daily: false, doneDays: {}, createdAt: now, updatedAt: now }, fields);
  state.items[it.id] = it; commit(); return it;
}
function update(id, patch) {
  const it = state.items[id]; if (!it || it.deleted) return;
  Object.assign(it, patch, { updatedAt: Date.now() }); commit();
}
function remove(id) { state.items[id] = { id, deleted: true, updatedAt: Date.now() }; commit(); }

/* ===== Task rules ===== */
// 100% => done; dropping below 100 from done => doing; any progress moves todo => doing.
function progressPatch(it, p) {
  p = clamp(Math.round(p) || 0, 0, 100);
  let s = it.status;
  if (p >= 100) s = 'done'; else if (s === 'done') s = 'doing'; else if (p > 0 && s === 'todo') s = 'doing';
  return { progress: p, status: s };
}
// Marking done fills progress; leaving done at 100% steps back one notch so the two stay consistent.
function statusPatch(it, s) {
  const patch = { status: s };
  if (s === 'done') patch.progress = 100;
  else if (it.status === 'done' && it.progress >= 100) patch.progress = 95;
  return patch;
}
function toggleDone(id) {
  const it = state.items[id]; if (!it || it.deleted) return;
  if (it.daily) { const t = today(), dd = { ...it.doneDays }; if (dd[t]) delete dd[t]; else dd[t] = 1; return update(id, { doneDays: dd }); }
  update(id, statusPatch(it, it.status === 'done' ? 'doing' : 'done'));
}
// Streak keeps counting if yesterday was done but today isn't yet.
function streak(it) {
  let d = today(), n = 0;
  if (!it.doneDays[d]) d = addDays(d, -1);
  while (it.doneDays[d]) { n++; d = addDays(d, -1); }
  return n;
}

  const title = (it.kind === 'task' ? 'Due: ' : '') + it.title;
  const opts = { body: [fmtDate(it.date), it.time && fmtTime(it.time), it.cat].filter(Boolean).join(' · '), tag: it.id, icon: 'icon.png' };
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) return reg.showNotification(title, opts); } catch {}
  try { new Notification(title, opts); } catch {}
}
function checkAlerts() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now(); let changed = false;
  for (const it of live()) {
    if (!it.title.trim() || (it.kind === 'task' && it.status === 'done')) continue;
    const t = triggerAt(it);
    if (t === null || now < t || now - t > 3600000) continue; // skip alerts more than an hour stale
    const k = it.id + '|' + t;
    if (fired[k]) continue;
    fired[k] = now; changed = true; notify(it);
  }
  for (const k in fired) if (now - fired[k] > 3 * 864e5) { delete fired[k]; changed = true; }
  if (changed) localStorage.setItem(FKEY, JSON.stringify(fired));
}

/* ===== Actions (event delegation) ===== */
const actions = {
  settings: () => { renderSettings(); setDlg.showModal(); },
  closeSet: () => setDlg.close(),
  closeEd: () => edDlg.close(),
  prev: () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); render(); },
  next: () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); render(); },
  today: () => { const t = new Date(); month = new Date(t.getFullYear(), t.getMonth(), 1); selected = today(); render(); },
  addDate: () => openEditor(create({ kind: 'date', date: selected, cat: filter === 'All' ? DEFAULT_CAT : filter }).id),
  addDeadline: () => openEditor(create({ kind: 'task', date: selected, cat: filter === 'All' ? DEFAULT_CAT : filter }).id),
  addNote,
  delNote: el => { const it = state.items[editingId]; if (!it) return; update(it.id, { notes: it.notes.filter(n => n.id !== el.dataset.id) }); fillEditor(); },
  del: () => { if (!editingId || !confirm('Delete this item?')) return; const id = editingId; editingId = null; remove(id); edDlg.close(); },
  syncNow: () => doSync(),
  disconnect: () => {
    if (!confirm('Disconnect sync on this device? Your local data stays.')) return;
    sync = {}; saveSync(); syncState = { kind: 'idle' }; renderSyncBtn(); renderSettings();
  },
  copy: el => {
    const url = el.dataset.url, ok = () => { el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy link'; }, 1500); };
    navigator.clipboard ? navigator.clipboard.writeText(url).then(ok, () => prompt('Copy this link:', url)) : prompt('Copy this link:', url);
  },
  notify: async () => { try { await Notification.requestPermission(); } catch {} renderSettings(); checkAlerts(); },
  backup: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    a.download = `tracker-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-toggle],[data-open],[data-day],[data-filter],[data-tab]');
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { view = d.tab; return render(); }
  if (d.filter) { filter = d.filter; return render(); }
  if (d.toggle) return toggleDone(d.toggle);
  if (d.open) return openEditor(d.open);
  if (d.day) {
    selected = d.day; const dt = parseYmd(d.day);
    if (dt.getMonth() !== month.getMonth() || dt.getFullYear() !== month.getFullYear()) month = new Date(dt.getFullYear(), dt.getMonth(), 1);
    return render();
  }
  if (actions[d.act]) actions[d.act](el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); openEditor(e.target.dataset.open); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'qa') {
    const title = $('#qaTitle').value.trim(), type = $('#qaType').value;
    if (!title) return;
    create({ kind: 'task', title, cat: $('#qaCat').value, daily: type === 'daily', date: type === 'deadline' ? ($('#qaDate').value || today()) : '' });
    $('#qaTitle').value = ''; $('#qaTitle').focus();
  } else if (e.target.id === 'tokForm') {
    const v = $('#tok').value.trim(); if (!v) return;
    sync = { token: v }; saveSync(); syncState = { kind: 'syncing' }; renderSettings(); doSync();
  }
});
const onInput = e => {
  if (e.target.form && e.target.form.id === 'edForm') onEditorInput(e);
  if (e.target.id === 'qaType') $('#qaDate').hidden = e.target.value !== 'deadline';
};
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
// 'toggle' doesn't bubble, so listen in the capture phase to remember the Completed list state.
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('done-list')) doneOpen = e.target.open; }, true);

/* ===== Init ===== */
const catOpts = Object.keys(CATS).map(c => `<option>${esc(c)}</option>`).join('');
$('#qaCat').innerHTML = $('#edCat').innerHTML = catOpts;
$('#qaCat').value = DEFAULT_CAT;
$('#edRemind').innerHTML = REMINDERS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
$('#filters').innerHTML = ['All', ...Object.keys(CATS)].map(c =>
  `<button class="fchip" data-filter="${esc(c)}" aria-pressed="false">${c === 'All' ? '' : `<span class="dot" style="--c:${CATS[c]}"></span>`}${esc(c)}</button>`).join('');
$('#wkdays').innerHTML = [...Array(7)].map((_, i) => `<span>${new Date(2023, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'short' })}</span>`).join('');

render();
doSync();
checkAlerts();
let lastDay = today();
setInterval(() => { checkAlerts(); if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncIfStale(); render(); } });
window.addEventListener('focus', syncIfStale);
window.addEventListener('online', () => doSync());
window.addEventListener('offline', () => { if (sync.token) { syncState = { kind: 'offline' }; afterSync(); } });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
